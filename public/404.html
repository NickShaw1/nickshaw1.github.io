<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>404 — Page not found | Nick Shaw</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono&display=swap');
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        background: #0a0a0a;
        color: #F0EDE6;
        font-family: 'Space Grotesk', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }
      .container { max-width: 480px; }
      .code {
        font-family: 'Space Mono', monospace;
        font-size: 0.75rem;
        color: #0AFF9D;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        margin-bottom: 1rem;
        line-height: 1.05;
      }
      h1 span { color: #0AFF9D; }
      p {
        color: #888888;
        font-size: 0.9375rem;
        line-height: 1.7;
        margin-bottom: 2.5rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        border: 1px solid #0AFF9D;
        background: rgba(10, 255, 157, 0.1);
        color: #F0EDE6;
        font-family: 'Space Mono', monospace;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 0.75rem 1.5rem;
        border-radius: 9999px;
        text-decoration: none;
        transition: background 0.15s ease;
      }
      a:hover { background: rgba(10, 255, 157, 0.2); }
    </style>
  </head>
  <body>
    <div class="container">
      <p class="code">404 — not found</p>
      <h1>Wrong<span> turn.</span></h1>
      <p>This page doesn't exist, or it may have moved. Head back to the homepage and we'll pretend this never happened.</p>
      <a href="/">Back to home</a>
    </div>
  </body>
</html>
